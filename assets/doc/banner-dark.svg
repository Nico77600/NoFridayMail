<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 540" width="2000" height="540">
  <!-- README banner (dark), rendered to docs/images/readme-banner-dark.png by npm run icons. -->
  <rect x="4" y="4" width="1992" height="532" rx="40" fill="#1B1B1F" stroke="#3A3A42" stroke-width="2"/>
  <defs><clipPath id="card"><rect x="4" y="4" width="1992" height="532" rx="40"/></clipPath></defs>
  <g clip-path="url(#card)">
    <rect x="0" y="0" width="2000" height="14" fill="#479EF5"/>
    <circle cx="1740" cy="190" r="330" fill="#1B2B42" opacity="0.55"/>
    <circle cx="1740" cy="190" r="250" fill="#1B1B1F" opacity="0.6"/>
  </g>
  <g transform="translate(80 78) scale(0.875)">
  <rect width="128" height="128" rx="26" fill="#0F6CBD"/>
  <rect x="20" y="30" width="78" height="76" rx="10" fill="#FFFFFF"/>
  <path d="M20 40a10 10 0 0 1 10-10h58a10 10 0 0 1 10 10v12H20z" fill="#C7E0F4"/>
  <rect x="38" y="20" width="9" height="20" rx="4.5" fill="#FFFFFF"/>
  <rect x="71" y="20" width="9" height="20" rx="4.5" fill="#FFFFFF"/>
  <g fill="#0F6CBD"><rect x="32" y="62" width="11" height="10" rx="2.5"/><rect x="53" y="62" width="11" height="10" rx="2.5"/><rect x="74" y="62" width="11" height="10" rx="2.5"/><rect x="32" y="80" width="11" height="10" rx="2.5"/><rect x="53" y="80" width="11" height="10" rx="2.5"/></g>
  <circle cx="94" cy="94" r="30" fill="#FFFFFF"/>
  <circle cx="94" cy="94" r="23" fill="none" stroke="#D13438" stroke-width="9"/>
  <path d="M78 110L110 78" stroke="#D13438" stroke-width="9" stroke-linecap="round"/>
</g>
  <text x="230" y="104" font-family="'Segoe UI Variable Text','Segoe UI',Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="3" fill="#479EF5">OUTLOOK ADD-IN · SMART ALERTS</text>
  <text x="226" y="186" font-family="'Segoe UI Variable Text','Segoe UI',Arial,sans-serif" font-size="76" font-weight="700" fill="#F5F5F5">NoFridayMail</text>
  <text font-family="'Segoe UI Variable Text','Segoe UI',Arial,sans-serif" font-size="36" fill="#D6D6D6">
    <tspan x="80" y="262">Stops mail and meeting invitations from leaving on the days</tspan>
    <tspan x="80" y="314">you choose, <tspan font-weight="700" fill="#F5F5F5">Friday</tspan> by default, and offers the <tspan font-weight="700" fill="#F5F5F5">next working</tspan></tspan>
    <tspan x="80" y="366"><tspan font-weight="700" fill="#F5F5F5">day</tspan> instead; an optional <tspan font-weight="700" fill="#F5F5F5">justified exceptional send</tspan> needs MFA.</tspan>
  </text>
  
  <rect x="80" y="418" width="228" height="58" rx="29" fill="#479EF5" />
  <text x="194" y="456" text-anchor="middle" font-family="'Segoe UI Variable Text','Segoe UI',Arial,sans-serif" font-size="26" font-weight="600" fill="#FFFFFF">Version 1.1.0</text>
  
  <rect x="330" y="418" width="400" height="58" rx="29" fill="#26262C" stroke="#4A4A53" stroke-width="2"/>
  <text x="530" y="456" text-anchor="middle" font-family="'Segoe UI Variable Text','Segoe UI',Arial,sans-serif" font-size="26" font-weight="400" fill="#D6D6D6">Outlook web, new and classic</text>
  
  <rect x="752" y="418" width="220" height="58" rx="29" fill="#26262C" stroke="#4A4A53" stroke-width="2"/>
  <text x="862" y="456" text-anchor="middle" font-family="'Segoe UI Variable Text','Segoe UI',Arial,sans-serif" font-size="26" font-weight="400" fill="#D6D6D6">MIT license</text>
  
  <rect x="994" y="418" width="340" height="58" rx="29" fill="#26262C" stroke="#4A4A53" stroke-width="2"/>
  <text x="1164" y="456" text-anchor="middle" font-family="'Segoe UI Variable Text','Segoe UI',Arial,sans-serif" font-size="26" font-weight="400" fill="#D6D6D6">by Nicolas Fabert</text>
  
  <rect x="1430" y="66" width="490" height="112" rx="22" fill="#26262C" stroke="#42424A" stroke-width="2"/>
  <text x="1520" y="136" text-anchor="middle" font-family="'Segoe UI Variable Text','Segoe UI',Arial,sans-serif" font-size="52" font-weight="700" fill="#479EF5">Fri</text>
  <text x="1608" y="116" font-family="'Segoe UI Variable Text','Segoe UI',Arial,sans-serif" font-size="28" font-weight="700" fill="#F5F5F5">blocked by default</text>
  <text x="1608" y="152" font-family="'Segoe UI Variable Text','Segoe UI',Arial,sans-serif" font-size="23" fill="#ADADAD">any days, per environment</text>
  
  <rect x="1430" y="206" width="490" height="112" rx="22" fill="#26262C" stroke="#42424A" stroke-width="2"/>
  <text x="1520" y="276" text-anchor="middle" font-family="'Segoe UI Variable Text','Segoe UI',Arial,sans-serif" font-size="52" font-weight="700" fill="#479EF5">2</text>
  <text x="1608" y="256" font-family="'Segoe UI Variable Text','Segoe UI',Arial,sans-serif" font-size="28" font-weight="700" fill="#F5F5F5">languages</text>
  <text x="1608" y="292" font-family="'Segoe UI Variable Text','Segoe UI',Arial,sans-serif" font-size="23" fill="#ADADAD">French and English</text>
  
  <rect x="1430" y="346" width="490" height="112" rx="22" fill="#26262C" stroke="#42424A" stroke-width="2"/>
  <text x="1520" y="416" text-anchor="middle" font-family="'Segoe UI Variable Text','Segoe UI',Arial,sans-serif" font-size="52" font-weight="700" fill="#479EF5">MFA</text>
  <text x="1608" y="396" font-family="'Segoe UI Variable Text','Segoe UI',Arial,sans-serif" font-size="28" font-weight="700" fill="#F5F5F5">exceptional send</text>
  <text x="1608" y="432" font-family="'Segoe UI Variable Text','Segoe UI',Arial,sans-serif" font-size="23" fill="#ADADAD">optional, traced end to end</text>
</svg>
