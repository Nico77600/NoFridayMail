<!doctype html>
<html lang="fr"> <!-- lang and texts are set by taskpane.js according to the display language -->
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>NoFridayMail</title>
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    /* Fluent 2 tokens (brand colour #0F6CBD, neutrals, shadows). Light by default; dark via
       prefers-color-scheme, forced by data-theme (set by taskpane.js from Office.context.officeTheme).
       Text/background pairs meet AA (4.5:1), checked by tests/theme.test.js. */
    :root {
      --bg: #ffffff; --fg: #242424; --fg2: #616161; --surface: #ffffff; --hover: #f5f5f5;
      --border: #d1d1d1; --border-strong: #616161; --selected: #ebf3fc;
      --hdr1: #f3f8fd; --hdr2: #d6e9f8;
      --brand: #0f6cbd; --brand-hover: #115ea3; --brand-pressed: #0c3b5e; --on-brand: #ffffff; --brand-fg: #0f6cbd;
      --focus: #242424;
      --error-fg: #b10e1c; --error-bg: #fdf3f4; --error-border: #eeacb2;
      --success-fg: #0e700e; --success-bg: #f1faf1; --success-border: #9fd89f;
      --info-bg: #f5f5f5; --info-border: #e0e0e0;
      --disabled-bg: #f0f0f0; --disabled-fg: #bdbdbd;
      --shadow: 0 1px 2px rgba(0, 0, 0, .14), 0 0 2px rgba(0, 0, 0, .12);
      --shadow-hover: 0 4px 8px rgba(0, 0, 0, .14), 0 0 2px rgba(0, 0, 0, .12);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #242424; --fg: #ffffff; --fg2: #adadad; --surface: #292929; --hover: #333333;
        --border: #525252; --border-strong: #adadad; --selected: #0a2e4a;
        --hdr1: #1c2a38; --hdr2: #0f3a5f;
        --brand: #115ea3; --brand-hover: #0f6cbd; --brand-pressed: #0c3b5e; --on-brand: #ffffff; --brand-fg: #479ef5;
        --focus: #ffffff;
        --error-fg: #e37d80; --error-bg: #3b0509; --error-border: #a4262c;
        --success-fg: #54b054; --success-bg: #052505; --success-border: #107c10;
        --info-bg: #292929; --info-border: #424242;
        --disabled-bg: #333333; --disabled-fg: #5c5c5c;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 0 2px rgba(0, 0, 0, .3);
        --shadow-hover: 0 4px 8px rgba(0, 0, 0, .5), 0 0 2px rgba(0, 0, 0, .3);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #242424; --fg: #ffffff; --fg2: #adadad; --surface: #292929; --hover: #333333;
      --border: #525252; --border-strong: #adadad; --selected: #0a2e4a;
      --hdr1: #1c2a38; --hdr2: #0f3a5f;
      --brand: #115ea3; --brand-hover: #0f6cbd; --brand-pressed: #0c3b5e; --on-brand: #ffffff; --brand-fg: #479ef5;
      --focus: #ffffff;
      --error-fg: #e37d80; --error-bg: #3b0509; --error-border: #a4262c;
      --success-fg: #54b054; --success-bg: #052505; --success-border: #107c10;
      --info-bg: #292929; --info-border: #424242;
      --disabled-bg: #333333; --disabled-fg: #5c5c5c;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 0 2px rgba(0, 0, 0, .3);
      --shadow-hover: 0 4px 8px rgba(0, 0, 0, .5), 0 0 2px rgba(0, 0, 0, .3);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; padding: 0; min-width: 0; min-height: 100vh; overflow-x: hidden;
      font-family: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
      font-size: 14px; line-height: 20px; color: var(--fg); background: var(--bg);
      display: flex; flex-direction: column;
    }
    [hidden] { display: none !important; }
    h1, h2, p { margin: 0; overflow-wrap: anywhere; }

    /* Header: light gradient in the brand colours */
    .header {
      display: flex; gap: 12px; align-items: flex-start; padding: 16px 12px 14px;
      background: linear-gradient(135deg, var(--hdr1), var(--hdr2)); border-bottom: 1px solid var(--border);
    }
    .logo { flex: none; width: 44px; height: 44px; border-radius: 10px; box-shadow: var(--shadow); }
    .header h1 { font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -.01em; }
    .sub { margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--fg2); }
    .badge {
      display: inline-block; margin-top: 8px; padding: 2px 8px; border-radius: 10px; font-size: 12px; line-height: 16px;
      color: var(--fg); background: var(--surface); border: 1px solid var(--border); overflow-wrap: anywhere;
    }
    .content { flex: 1; padding: 16px 12px 12px; min-width: 0; }
    .section-title { margin: 0 0 8px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--fg2); }
    .section { margin-bottom: 20px; }

    /* Cards (suggestions, days) */
    .group { display: flex; flex-direction: column; gap: 8px; }
    .card {
      display: flex; align-items: center; gap: 12px; width: 100%; min-width: 0; padding: 10px 12px;
      border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--fg);
      box-shadow: var(--shadow); cursor: pointer; user-select: none;
      transition: background-color .12s ease, border-color .12s ease, box-shadow .12s ease, transform .12s ease;
    }
    .card:hover, .day:hover, .chip:hover { background: var(--hover); box-shadow: var(--shadow-hover); }
    .card:active, .day:active, .chip:active { transform: scale(.985); }
    .card:focus-visible, .day:focus-visible, .chip:focus-visible, .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .card[aria-checked="true"], .day[aria-checked="true"] { border-color: var(--brand-fg); background: var(--selected); box-shadow: inset 0 0 0 1px var(--brand-fg); }
    .radio {
      flex: none; width: 16px; height: 16px; border: 1px solid var(--border-strong); border-radius: 50%;
      display: grid; place-items: center; background: var(--surface);
    }
    .card[aria-checked="true"] .radio { border-color: var(--brand-fg); }
    .card[aria-checked="true"] .radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--brand-fg); animation: pop .18s ease; }
    .card-text { flex: 1; min-width: 0; }
    .card-title { font-weight: 600; overflow-wrap: anywhere; }
    .card-sub { font-size: 12px; line-height: 16px; color: var(--fg2); overflow-wrap: anywhere; }
    .card-icon { flex: none; width: 20px; height: 20px; color: var(--fg2); }
    .card[aria-checked="true"] .card-icon { color: var(--brand-fg); }

    /* Day row: contained horizontal scrolling, scroll snapping */
    .days {
      display: flex; gap: 8px; max-width: 100%; overflow-x: auto; overscroll-behavior-x: contain;
      scroll-snap-type: x proximity; padding: 2px 2px 10px; margin: 0 -2px; scrollbar-width: thin;
    }
    .day {
      position: relative; flex: none; width: 68px; min-height: 92px; padding: 8px 4px 6px; scroll-snap-align: start;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--fg);
      box-shadow: var(--shadow); cursor: pointer; user-select: none;
      transition: background-color .12s ease, border-color .12s ease, box-shadow .12s ease, transform .12s ease;
    }
    .day-rel { min-height: 12px; font-size: 10px; line-height: 12px; font-weight: 600; color: var(--brand-fg); }
    .day-wd { font-size: 11px; line-height: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--fg2); }
    .day-num { font-size: 24px; line-height: 30px; font-weight: 600; }
    .day-mon { font-size: 12px; line-height: 16px; color: var(--fg2); }
    .day[aria-checked="true"] .day-wd, .day[aria-checked="true"] .day-mon { color: var(--fg); }
    .check { position: absolute; top: 4px; right: 4px; width: 14px; height: 14px; color: var(--brand-fg); display: none; }
    .day[aria-checked="true"] .check { display: block; animation: pop .18s ease; }

    /* Time chips */
    .times { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      min-width: 64px; padding: 5px 12px; text-align: center; font-weight: 600; border-radius: 16px;
      border: 1px solid var(--border-strong); background: var(--surface); color: var(--fg); cursor: pointer; user-select: none;
      transition: background-color .12s ease, border-color .12s ease, box-shadow .12s ease, transform .12s ease;
    }
    .chip[aria-checked="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); box-shadow: var(--shadow); animation: pop .18s ease; }
    .chip[aria-checked="true"]:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
    .hint { font-size: 12px; line-height: 16px; color: var(--fg2); }

    /* Sticky footer: status, summary, primary action */
    .footer {
      position: sticky; bottom: 0; z-index: 2; padding: 10px 12px 14px; background: var(--bg);
      border-top: 1px solid var(--border); box-shadow: 0 -6px 12px -8px rgba(0, 0, 0, .25);
      display: flex; flex-direction: column; gap: 8px;
    }
    .summary { min-height: 16px; font-size: 12px; line-height: 16px; color: var(--fg2); overflow-wrap: anywhere; }
    .summary.err { color: var(--error-fg); }
    .btn {
      width: 100%; min-height: 36px; padding: 6px 12px; font: inherit; font-weight: 600; text-align: center;
      border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface); color: var(--fg); cursor: pointer;
      overflow-wrap: anywhere; transition: background-color .12s ease, transform .12s ease;
    }
    .btn:hover:not(:disabled) { background: var(--hover); }
    .btn:active:not(:disabled) { transform: scale(.99); }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
    .btn.primary:hover:not(:disabled) { background: var(--brand-hover); border-color: var(--brand-hover); }
    .btn.primary:active:not(:disabled) { background: var(--brand-pressed); border-color: var(--brand-pressed); }
    .btn:disabled { background: var(--disabled-bg); border-color: var(--border); color: var(--disabled-fg); cursor: not-allowed; }
    .btn.subtle { min-height: 32px; font-weight: 400; background: transparent; border-color: transparent; color: var(--brand-fg); }
    .btn.subtle:hover:not(:disabled) { background: var(--hover); }

    /* Status banner (MessageBar style) */
    .banner {
      display: flex; gap: 8px; align-items: flex-start; padding: 8px 12px;
      border: 1px solid var(--info-border); border-radius: 8px; background: var(--info-bg); color: var(--fg);
      font-size: 12px; line-height: 16px;
    }
    .banner.success { background: var(--success-bg); border-color: var(--success-border); }
    .banner.error { background: var(--error-bg); border-color: var(--error-border); }
    .banner-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .banner svg, .spinner { flex: none; width: 16px; height: 16px; display: none; }
    .banner.info svg.i-info, .banner.success svg.i-success, .banner.error svg.i-error { display: block; }
    .banner.info svg.i-info { color: var(--brand-fg); }
    .banner.success svg.i-success { color: var(--success-fg); }
    .banner.error svg.i-error { color: var(--error-fg); }
    .banner.busy svg { display: none !important; }
    .banner.busy .spinner { display: block; }
    .spinner { border: 2px solid var(--border); border-top-color: var(--brand-fg); border-radius: 50%; animation: spin .8s linear infinite; }
    #unsupported { margin: 16px 12px 0; }

    /* Exceptional send: collapsed section, deliberately discreet (secondary button, no brand colour)
       so it does not compete with the primary action "Schedule and send". */
    .bypass { margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--border); }
    .disclosure {
      display: flex; align-items: center; gap: 8px; width: 100%; min-height: 36px; padding: 6px 4px; margin: 0;
      font: inherit; font-weight: 600; text-align: left; color: var(--fg); background: transparent; border: 0;
      border-radius: 6px; cursor: pointer;
    }
    .disclosure:hover { background: var(--hover); }
    .disclosure:focus-visible, #bypass-text:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .chev { flex: none; width: 16px; height: 16px; color: var(--fg2); transition: transform .12s ease; }
    .disclosure[aria-expanded="true"] .chev { transform: rotate(90deg); }
    .bypass-panel, .bypass-form { display: flex; flex-direction: column; gap: 8px; }
    .bypass-panel { padding: 4px 4px 0; }
    .field-label { font-weight: 600; }
    #bypass-text {
      display: block; width: 100%; min-width: 0; min-height: 76px; padding: 6px 8px; font: inherit; resize: vertical;
      color: var(--fg); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px;
    }
    #bypass-text[aria-invalid="true"] { border-color: var(--error-fg); }
    .counter { text-align: right; }
    .counter.err, .field-error { color: var(--error-fg); }
    .field-error { font-size: 12px; line-height: 16px; }
    .field-error.info { color: var(--fg2); }
    .saved { display: flex; flex-direction: column; gap: 4px; padding: 8px 12px; border: 1px solid var(--success-border); border-radius: 8px; background: var(--success-bg); font-size: 12px; line-height: 16px; }
    .saved .btn { align-self: flex-start; width: auto; padding-left: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pop { from { transform: scale(.9); } to { transform: scale(1); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
    @media (forced-colors: active) {
      .card[aria-checked="true"], .day[aria-checked="true"], .chip[aria-checked="true"] { outline: 2px solid Highlight; }
    }
  </style>
</head>

          <span class="day-wd" id="day-7-wd"></span>
          <span class="day-num" id="day-7-num"></span>
          <span class="day-mon" id="day-7-mon"></span>
          <svg class="check" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="8" fill="currentColor" /><path d="M4.6 8.2l2.4 2.4 4.4-4.6" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </div>
        <div class="day" id="day-8" role="radio" aria-checked="false" tabindex="-1" hidden>
          <span class="day-rel" id="day-8-rel"></span>
          <span class="day-wd" id="day-8-wd"></span>
          <span class="day-num" id="day-8-num"></span>
          <span class="day-mon" id="day-8-mon"></span>
          <svg class="check" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="8" fill="currentColor" /><path d="M4.6 8.2l2.4 2.4 4.4-4.6" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </div>
        <div class="day" id="day-9" role="radio" aria-checked="false" tabindex="-1" hidden>
          <span class="day-rel" id="day-9-rel"></span>
          <span class="day-wd" id="day-9-wd"></span>
          <span class="day-num" id="day-9-num"></span>
          <span class="day-mon" id="day-9-mon"></span>
          <svg class="check" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="8" fill="currentColor" /><path d="M4.6 8.2l2.4 2.4 4.4-4.6" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title" id="title-times"></h2>
      <p class="hint" id="times-hint"></p>
      <div class="times" id="times-group" role="radiogroup" aria-labelledby="title-times" hidden>
        <div class="chip" id="chip-0" role="radio" aria-checked="false" tabindex="0" hidden></div>
        <div class="chip" id="chip-1" role="radio" aria-checked="false" tabindex="-1" hidden></div>
        <div class="chip" id="chip-2" role="radio" aria-checked="false" tabindex="-1" hidden></div>
        <div class="chip" id="chip-3" role="radio" aria-checked="false" tabindex="-1" hidden></div>
        <div class="chip" id="chip-4" role="radio" aria-checked="false" tabindex="-1" hidden></div>
        <div class="chip" id="chip-5" role="radio" aria-checked="false" tabindex="-1" hidden></div>
        <div class="chip" id="chip-6" role="radio" aria-checked="false" tabindex="-1" hidden></div>
        <div class="chip" id="chip-7" role="radio" aria-checked="false" tabindex="-1" hidden></div>
      </div>
    </section>

    <section class="section bypass" id="bypass-section" hidden>
      <button type="button" class="disclosure" id="bypass-toggle" aria-expanded="false" aria-controls="bypass-panel">
        <svg class="chev" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M6 3.5l4.5 4.5L6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
        <span id="bypass-title"></span>
      </button>
      <div class="bypass-panel" id="bypass-panel" hidden>
        <p class="hint" id="bypass-intro"></p>
        <p class="hint" id="bypass-unsupported" role="alert" hidden></p>
        <div class="bypass-form" id="bypass-form">
        <div class="saved" id="bypass-saved" role="status" hidden>
          <span id="bypass-saved-text"></span>
          <button type="button" id="bypass-remove" class="btn subtle"></button>
        </div>
        <label class="field-label" id="bypass-label" for="bypass-text"></label>
        <textarea id="bypass-text" rows="3" aria-describedby="bypass-counter bypass-error" aria-invalid="false" aria-required="true"></textarea>
        <p class="hint counter" id="bypass-counter"></p>
        <p class="field-error" id="bypass-error" aria-live="polite" hidden></p>
        <button type="button" id="bypass-send" class="btn" disabled></button>
        <button type="button" id="bypass-retry" class="btn" hidden></button>
        <p class="hint" id="bypass-reuse" hidden></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer" id="footer" hidden>
    <div id="status" class="banner info" hidden role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <svg class="i-info" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="currentColor" /><path d="M8 7v4" stroke="#fff" stroke-width="1.6" stroke-linecap="round" /><circle cx="8" cy="4.8" r=".9" fill="#fff" /></svg>
      <svg class="i-success" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="currentColor" /><path d="M4.8 8.2l2.2 2.2 4.2-4.4" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
      <svg class="i-error" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="currentColor" /><path d="M5.5 5.5l5 5M10.5 5.5l-5 5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" /></svg>
      <span class="banner-text" id="result"></span>
    </div>
    <p class="summary" id="summary" aria-live="polite"></p>
    <button type="button" id="confirm" class="btn primary" disabled></button>
    <button type="button" id="remove" class="btn subtle" hidden></button>
  </footer>
</body>
</html>
